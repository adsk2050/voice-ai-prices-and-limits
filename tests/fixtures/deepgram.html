<html><head>
<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://deepgram.com/#organization","name":"Deepgram","legalName":"Deepgram, Inc.","description":"Deepgram is a foundational Voice AI platform for developers, offering unified APIs for Speech-to-Text (STT), Text-to-Speech (TTS), and autonomous Voice Agent orchestration. Available as a managed API (US, EU, and Australia endpoints), in-VPC, or self-hosted.","url":"https://deepgram.com/","logo":{"@type":"ImageObject","url":"https://cdn.sanity.io/images/zf5tfwjf/production/3818f1627afb5c56de70f59470f7548165f0e1cc-500x500.svg"},"address":{"@type":"PostalAddress","streetAddress":"505 Howard St, Ste. 150","addressLocality":"San Francisco","addressRegion":"CA","postalCode":"94105","addressCountry":"US"},"contactPoint":[{"@type":"ContactPoint","contactType":"sales","url":"https://deepgram.com/contact-us","availableLanguage":["English"]},{"@type":"ContactPoint","contactType":"technical support","url":"https://developers.deepgram.com/support","availableLanguage":["English"]},{"@type":"ContactPoint","contactType":"customer service","email":"info@deepgram.com","availableLanguage":["English"]},{"@type":"ContactPoint","contactType":"security","email":"security@deepgram.com","availableLanguage":["English"]},{"@type":"ContactPoint","contactType":"legal","email":"legalnotices@deepgram.com","availableLanguage":["English"]}],"sameAs":["https://www.wikidata.org/wiki/Q115770008","https://www.crunchbase.com/organization/deepgram","https://www.linkedin.com/company/deepgram/","https://x.com/deepgramai","https://github.com/deepgram","https://www.youtube.com/@Deepgram","https://www.facebook.com/deepgram/","https://discord.com/servers/deepgram-1108042150941294664","https://huggingface.co/Deepgram","https://bsky.app/profile/deepgram.com"]},{"@type":"FAQPage","@id":"https://deepgram.com/pricing#faq","url":"https://deepgram.com/pricing","mainEntity":[{"@type":"Question","name":"How much does speech-to-text cost per hour?","acceptedAnswer":{"@type":"Answer","text":"Monolingual streaming is $0.46 an hour on Pay as you go, for either Nova-3 or Flux STT, and $0.39 on Growth. Multilingual is $0.55 for Nova-3 and $0.47 for Flux STT. Pre-recorded runs lower."}},{"@type":"Question","name":"What is the difference between Pay as you go and Growth?","acceptedAnswer":{"@type":"Answer","text":"Pay as you go has no commitment and bills against credits as you use them. Growth starts at $4,000 a year in pre-paid annual credits for up to 20% off and higher streaming concurrency."}},{"@type":"Question","name":"What does the $200 free credit cover?","acceptedAnswer":{"@type":"Answer","text":"Roughly 43,000 minutes, over 700 hours, of Nova-3 transcription. It does not expire, so you can prototype without a clock running. No credit card is required to start."}},{"@type":"Question","name":"How does Voice Agent pricing work?","acceptedAnswer":{"@type":"Answer","text":"Billed per minute of WebSocket connection time, with one rate covering speech-to-text, a managed language model, and text-to-speech. Bringing your own language model or voice moves you to a lower tier."}},{"@type":"Question","name":"How is text-to-speech billed?","acceptedAnswer":{"@type":"Answer","text":"Per 1,000 characters of input text, across Flux TTS, Aura-2, and Aura-1. Rates differ by model and plan, and the table above carries the current figures."}},{"@type":"Question","name":"Do you charge for silence or round up audio?","acceptedAnswer":{"@type":"Answer","text":"No. Billing is per second of processed audio, so a 14-second file bills as 14 seconds. There is no minimum duration and no rounding up to the next block."}},{"@type":"Question","name":"Do Audio Intelligence features cost extra?","acceptedAnswer":{"@type":"Answer","text":"Yes, billed per 1,000 input and output tokens on top of transcription. They run on purpose-built small language models rather than a general-purpose LLM, which is why the per-unit cost is low."}},{"@type":"Question","name":"What happens if you exceed your concurrency limit?","acceptedAnswer":{"@type":"Answer","text":"Requests beyond your limit are queued or rejected. Pay as you go allows 150 concurrent streaming speech-to-text connections and Growth 225; Enterprise limits are set to your peak traffic."}},{"@type":"Question","name":"How do overages work on Growth?","acceptedAnswer":{"@type":"Answer","text":"Exceeding your credits bills at your Growth rate plus 10%, charged weekly on Mondays for the prior week. A card must stay on file; without one, requests return a 402 once credits run out."}},{"@type":"Question","name":"Can you avoid the 10% overage premium?","acceptedAnswer":{"@type":"Answer","text":"Yes. Early renew at any time by purchasing a new Growth plan in the Console. That resets your credits to the standard rate and moves your billing cycle forward."}},{"@type":"Question","name":"How is multichannel audio billed?","acceptedAnswer":{"@type":"Answer","text":"By total processed duration. A ten-minute stereo file contains twenty minutes of audio across two channels, so it bills as twenty minutes."}},{"@type":"Question","name":"Can you self-host or deploy in your own cloud?","acceptedAnswer":{"@type":"Answer","text":"Yes. Self-hosted containers run in your own VPC or on-prem hardware and require NVIDIA GPUs. It is available on Enterprise, for teams with data sovereignty or security requirements that rule out cloud processing."}},{"@type":"Question","name":"Which security and compliance standards do you support?","acceptedAnswer":{"@type":"Answer","text":"SOC 2 Type 1 and Type 2, HIPAA with a BAA for Enterprise, GDPR with an EU endpoint, CCPA, and PCI. FIPS 140-3 images are available for self-hosted deployments."}},{"@type":"Question","name":"Do you offer volume discounts?","acceptedAnswer":{"@type":"Answer","text":"Yes. Enterprise pricing ladders down with committed volume, and includes custom model training and a named account team. Talk to sales if you are processing millions of minutes a month."}},{"@type":"Question","name":"Are Nova-2, Enhanced and Base still available?","acceptedAnswer":{"@type":"Answer","text":"Yes, at unchanged rates for existing deployments: Nova-2 streaming $0.35 an hour, Enhanced $0.99, Base $0.87. Growth is about 12.5% lower. New projects should start with Nova-3 for general transcription or Flux for real-time voice agents."}},{"@type":"Question","name":"What is the refund request process?","acceptedAnswer":{"@type":"Answer","text":"To request a refund for unused credits purchased within the last 30 days, please contact consolebilling@deepgram.com. We will review your account and process any eligible refunds promptly."}}]},{"@type":"BreadcrumbList","@id":"https://deepgram.com/pricing#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://deepgram.com/"},{"@type":"ListItem","position":2,"name":"Pricing","item":"https://deepgram.com/pricing"}]},{"@type":"WebPage","@id":"https://deepgram.com/pricing#webpage","name":"Deepgram pricing | Scalable speech-to-text, text-to-speech \u0026 Voice Agent APIs","description":"Simple, transparent pricing for Speech-to-Text (STT), Text-to-Speech (TTS), and Voice Agent APIs. Start for free with $200 credit.","url":"https://deepgram.com/pricing","inLanguage":"en-US","isPartOf":{"@id":"https://deepgram.com/#website"},"publisher":{"@id":"https://deepgram.com/#organization"},"breadcrumb":{"@id":"https://deepgram.com/pricing#breadcrumb"}},{"@type":"OfferCatalog","@id":"https://deepgram.com/pricing#offers","name":"Rates by product","numberOfItems":74,"itemListElement":[{"@type":"Offer","name":"Speech-to-text: Flux STT English (Streaming) — Pay as you go","category":"Pay as you go","price":0.0077,"priceCurrency":"USD","priceSpecification":{"@type":"UnitPriceSpecification","price":0.0077,"priceCurrency":"USD","unitText":"minute","unitCode":"MIN"},"itemOffered":{"@type":"Service","name":"Flux STT Eng
