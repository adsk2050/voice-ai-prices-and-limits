name: Request a provider or model
description: Ask for a speech-to-text, text-to-speech or telephony provider (or one of its models) to be tracked.
labels: [new-provider]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [Speech-to-text, Text-to-speech, Telephony]
    validations: { required: true }
  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: e.g. AssemblyAI Universal-2
    validations: { required: true }
  - type: input
    id: url
    attributes:
      label: Pricing page
      description: The page that lists the price. A rate-limit page too, if there is one.
      placeholder: https://
    validations: { required: true }
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Plans, regions, currency, billing pulse. Say if you will send the scraper yourself.
