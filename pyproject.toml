[project]
name = "voice-prices"
version = "0.1.0"
description = "Scrapers that keep voice AI prices and limits as structured data"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "mcp>=2.3",
]

[project.scripts]
voice-prices = "voice_prices.update:main"
voice-prices-mcp = "voice_prices.mcp_server:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
